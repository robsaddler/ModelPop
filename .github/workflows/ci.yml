name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      # 3.13 is the floor declared in pyproject; 3.14 is what the app is
      # developed and run on. Testing only one of them lets the other rot.
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the environment
        run: uv venv --python ${{ matrix.python }}

      - name: Install
        run: uv pip install -e . --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Architecture contracts
        run: uv run lint-imports

      - name: Fast tests
        # `renders` is excluded, not skipped: VTK does not fail on a GPU-less
        # GitHub runner, it takes the whole process down with an access
        # violation, so there is nothing for pytest to catch. Those tests run
        # locally, where there is a real context to render into.
        run: >
          uv run pytest -m "not integration and not eval and not renders"
          --cov --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: .coverage
          if-no-files-found: ignore
